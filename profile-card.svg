<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="DEV YAJI - BSIT student at Quezon City University. Learning AI Engineering, DevOps and Automation." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061224"/>
      <stop offset="1" stop-color="#0A1D38"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" opacity="0.13"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .flow { animation: flow 3.4s ease-in-out infinite; }
    @keyframes flow {
      0%   { transform: translateY(0);     opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(120px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } }
  </style>

  <!-- canvas -->
  <rect width="1000" height="290" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="290" rx="22" fill="url(#dots)"/>
  <rect width="1000" height="290" rx="22" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="289" rx="21.5" fill="none" stroke="#38BDF8" stroke-opacity="0.22"/>

  <!-- identity -->
  <text x="46" y="148" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#ac)">DEV YAJI</text>
  <text x="50" y="192" font-size="22" font-weight="500" fill="#BAE6FD">BSIT student at Quezon City University</text>
  <text x="50" y="230" font-size="15" font-style="italic" fill="#38BDF8" fill-opacity="0.9">Keep learning. Keep building. Keep pushing forward.</text>

  <!-- divider -->
  <line x1="640" y1="52" x2="640" y2="238" stroke="#38BDF8" stroke-opacity="0.18"/>

  <!-- learning pipeline -->
  <line x1="700" y1="90" x2="700" y2="210" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>

  <circle cx="700" cy="90" r="10" fill="#061224" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="700" cy="90" r="4" fill="#38BDF8"/>
  <text x="728" y="90" font-size="21" font-weight="600" fill="#E0F2FE">AI Engineering</text>
  <text x="728" y="111" font-size="14" fill="#7DD3FC" fill-opacity="0.8">Models, LLMs and data</text>

  <circle cx="700" cy="150" r="10" fill="#061224" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="700" cy="150" r="4" fill="#38BDF8"/>
  <text x="728" y="150" font-size="21" font-weight="600" fill="#E0F2FE">DevOps</text>
  <text x="728" y="171" font-size="14" fill="#7DD3FC" fill-opacity="0.8">Containers, cloud and CI/CD</text>

  <circle cx="700" cy="210" r="10" fill="#38BDF8" stroke="#BAE6FD" stroke-width="2"/>
  <circle cx="700" cy="210" r="4" fill="#061224"/>
  <text x="728" y="210" font-size="21" font-weight="600" fill="#E0F2FE">Automation</text>
  <text x="728" y="231" font-size="14" fill="#7DD3FC" fill-opacity="0.8">Scripts, bots and workflows</text>

  <!-- pulse travelling down the pipeline -->
  <g class="flow">
    <circle cx="700" cy="90" r="12" fill="#38BDF8" opacity="0.25"/>
    <circle cx="700" cy="90" r="5" fill="#E0F2FE"/>
  </g>
</svg>
