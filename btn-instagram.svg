<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 72" width="162" height="72" role="img" aria-label="Instagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#B9D3F3"/><stop offset="1" stop-color="#5B94D6"/></linearGradient>
