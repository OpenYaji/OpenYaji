<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 92" width="600" height="92" role="img" aria-labelledby="title desc">
  <title id="title">Code, Test, Deploy, Learn</title>
  <desc id="desc">Four steps connected in a workflow, with a moving progress marker.</desc>
  <style>
    text { font: 600 17px system-ui, sans-serif; fill: #e2e8f0; }
    .progress { animation: travel 8s ease-in-out infinite; }
    @keyframes travel { 0%, 10% { transform: translateX(0); } 30% { transform: translateX(150px); } 55% { transform: translateX(300px); } 80%, 100% { transform: translateX(450px); } }
    @media (prefers-reduced-motion: reduce) { .progress { animation: none; } }
  </style>
  <rect width="600" height="92" rx="10" fill="#16232c"/>
  <path d="M75 63H525" stroke="#536571" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="75" y="36">Code</text><text x="225" y="36">Test</text>
    <text x="375" y="36">Deploy</text><text x="525" y="36">Learn</text>
  </g>
  <g fill="#a4cbbf"><circle cx="75" cy="63" r="4"/><circle cx="225" cy="63" r="4"/><circle cx="375" cy="63" r="4"/><circle cx="525" cy="63" r="4"/></g>
  <circle class="progress" cx="75" cy="63" r="7" fill="#71e0b7"/>
</svg>
