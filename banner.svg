<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="DEVYAJI - BSIT student at Quezon City University. Chief Technology Officer at Seegla, QA Intern at Bayani Technology Solutions Inc., 2x Hackathon Winner. Currently learning AI Engineering, DevOps and Automation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161F"/><stop offset="1" stop-color="#1A2232"/>
    </linearGradient>
    <clipPath id="cp"><rect width="1000" height="300" rx="30"/></clipPath>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#5B94D6" opacity="0.11"/>
    </pattern>
    <path id="sp" d="M0,-10 C1.5,-3 3,-1.5 10,0 C3,1.5 1.5,3 0,10 C-1.5,3 -3,1.5 -10,0 C-3,-1.5 -1.5,-3 0,-10Z"/>
    <linearGradient id="gT" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#E6EEFA"/><stop offset="1" stop-color="#5B94D6"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>

    <!-- the only clay element: puffy lettering -->
    <filter id="clayT" x="-8%" y="-25%" width="116%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="8" flood-color="#1E4E8C" flood-opacity="0.7" result="d"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="b"/>
      <feOffset in="b" dx="5" dy="5" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feComposite in2="e1" operator="in" result="hi"/>
      <feOffset in="b" dx="-5" dy="-5" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/>
      <feFlood flood-color="#143A6B" flood-opacity="0.6"/>
      <feComposite in2="e2" operator="in" result="sh"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="hi"/><feMergeNode in="sh"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .nm { font-family: 'Arial Rounded MT Bold','Nunito','Segoe UI Black','Segoe UI',Helvetica,Arial,sans-serif; }
    .tw { animation: tw 3s ease-in-out infinite; }
    .d1 { animation-delay: -0.8s; } .d2 { animation-delay: -1.6s; } .d3 { animation-delay: -2.3s; }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .tw { animation: none; opacity: 0.8; } }
  </style>

  <!-- canvas + starfield -->
  <g clip-path="url(#cp)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle cx="930" cy="40" r="120" fill="#2F6DB5" opacity="0.22" filter="url(#soft)"/>
    <circle cx="90" cy="300" r="130" fill="#1E4E8C" opacity="0.26" filter="url(#soft)"/>
    <circle cx="800" cy="150" r="200" fill="none" stroke="#5B94D6" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="800" cy="150" r="270" fill="none" stroke="#5B94D6" stroke-opacity="0.05" stroke-width="2"/>

    <g fill="#B9D3F3">
      <circle cx="120" cy="24" r="1.5" opacity="0.8"/><circle cx="210" cy="14" r="1.2" opacity="0.6"/>
      <circle cx="380" cy="22" r="1.6" opacity="0.8"/><circle cx="540" cy="16" r="1.2" opacity="0.6"/>
      <circle cx="660" cy="284" r="1.6" opacity="0.8"/><circle cx="740" cy="288" r="1.4" opacity="0.7"/>
      <circle cx="880" cy="22" r="1.5" opacity="0.8"/><circle cx="975" cy="64" r="1.3" opacity="0.6"/>
      <circle cx="985" cy="156" r="1.6" opacity="0.8"/><circle cx="978" cy="210" r="1.2" opacity="0.6"/>
      <circle cx="890" cy="286" r="1.5" opacity="0.7"/><circle cx="420" cy="290" r="1.3" opacity="0.6"/>
      <circle cx="290" cy="290" r="1.5" opacity="0.8"/><circle cx="16" cy="150" r="1.4" opacity="0.6"/>
    </g>
    <g fill="#E6EEFA">
      <use href="#sp" class="tw" transform="translate(30 30) scale(0.75)"/>
      <use href="#sp" class="tw d1" fill="#7FB59F" transform="translate(300 22) scale(0.95)"/>
      <use href="#sp" class="tw d2" transform="translate(468 30) scale(0.6)"/>
      <use href="#sp" class="tw d3" fill="#EBB892" transform="translate(790 28) scale(1)"/>
      <use href="#sp" class="tw d1" transform="translate(952 34) scale(0.7)"/>
      <use href="#sp" class="tw d2" fill="#7FB59F" transform="translate(624 30) scale(0.9)"/>
      <use href="#sp" class="tw" transform="translate(988 262) scale(0.8)"/>
      <use href="#sp" class="tw d3" transform="translate(810 288) scale(0.9)"/>
      <use href="#sp" class="tw d1" transform="translate(520 290) scale(0.65)"/>
      <use href="#sp" class="tw d2" fill="#EBB892" transform="translate(24 284) scale(0.8)"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="29.5" fill="none" stroke="#7FA8DB" stroke-opacity="0.2"/>

  <!-- DEVYAJI: the one clay element -->
  <text class="nm" x="52" y="134" font-size="112" font-weight="900" textLength="540" lengthAdjust="spacingAndGlyphs" fill="url(#gT)" filter="url(#clayT)">DEVYAJI</text>

  <!-- minimalist text -->
  <text x="54" y="186" font-size="20" font-weight="700" fill="#E6EEFA">BSIT student at Quezon City University</text>
  <text x="54" y="215" font-size="17" fill="#8DB6E8"><tspan font-weight="700" fill="#E6EEFA">Chief Technology Officer</tspan> @ Seegla</text>
  <text x="54" y="240" font-size="17" fill="#8DB6E8"><tspan font-weight="700" fill="#E6EEFA">QA Intern</tspan> @ Bayani Technology Solutions Inc.</text>
  <text x="54" y="265" font-size="17" font-weight="700" fill="#E6EEFA">2x Hackathon Winner</text>

  <line x1="640" y1="60" x2="640" y2="250" stroke="#5B94D6" stroke-opacity="0.25"/>

  <text x="680" y="84" font-size="14" fill="#8DB6E8">Currently learning</text>
  <line x1="680" y1="100" x2="950" y2="100" stroke="#5B94D6" stroke-opacity="0.3"/>
  <circle cx="690" cy="130" r="4" fill="#5B94D6"/>
  <text x="708" y="140" font-size="28" font-weight="700" fill="#E6EEFA">AI Engineering</text>
  <line x1="680" y1="160" x2="950" y2="160" stroke="#5B94D6" stroke-opacity="0.3"/>
  <circle cx="690" cy="190" r="4" fill="#7FB59F"/>
  <text x="708" y="200" font-size="28" font-weight="700" fill="#E6EEFA">DevOps</text>
  <line x1="680" y1="220" x2="950" y2="220" stroke="#5B94D6" stroke-opacity="0.3"/>
  <circle cx="690" cy="250" r="4" fill="#EBB892"/>
  <text x="708" y="260" font-size="28" font-weight="700" fill="#E6EEFA">Automation</text>
</svg>
