<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="DEVYAJI - BSIT student at Quezon City University. Chief Technology Officer at Seegla, QA Intern at Bayani Technology Solutions Inc., 2x Hackathon Winner." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161F"/><stop offset="1" stop-color="#1A2232"/>
    </linearGradient>
    <clipPath id="cp"><rect width="1000" height="300" rx="30"/></clipPath>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#5B94D6" opacity="0.14"/>
    </pattern>
    <path id="sp" d="M0,-10 C1.5,-3 3,-1.5 10,0 C3,1.5 1.5,3 0,10 C-1.5,3 -3,1.5 -10,0 C-3,-1.5 -1.5,-3 0,-10Z"/>

    <linearGradient id="gT" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#E6EEFA"/><stop offset="1" stop-color="#5B94D6"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#E6EEFA"/><stop offset="1" stop-color="#8DB6E8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#B9D3F3"/><stop offset="1" stop-color="#5B94D6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5B94D6"/><stop offset="1" stop-color="#1E4E8C"/>
    </linearGradient>
    <linearGradient id="gP" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2F6DB5"/><stop offset="1" stop-color="#1E4E8C"/>
    </linearGradient>
    <radialGradient id="gS" cx="0.3" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#E6EEFA"/><stop offset="0.5" stop-color="#5B94D6"/><stop offset="1" stop-color="#1E4E8C"/>
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>

    <filter id="clay" x="-15%" y="-30%" width="130%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#1E4E8C" flood-opacity="0.55" result="d"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="7" dy="7" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.8"/>
      <feComposite in2="e1" operator="in" result="hi"/>
      <feOffset in="b" dx="-7" dy="-7" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/>
      <feFlood flood-color="#143A6B" flood-opacity="0.5"/>
      <feComposite in2="e2" operator="in" result="sh"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="hi"/><feMergeNode in="sh"/></feMerge>
    </filter>
    <filter id="clayT" x="-8%" y="-25%" width="116%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#1E4E8C" flood-opacity="0.6" result="d"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
      <feOffset in="b" dx="4" dy="4" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feComposite in2="e1" operator="in" result="hi"/>
      <feOffset in="b" dx="-4" dy="-4" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/>
      <feFlood flood-color="#143A6B" flood-opacity="0.55"/>
      <feComposite in2="e2" operator="in" result="sh"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="hi"/><feMergeNode in="sh"/></feMerge>
    </filter>
    <filter id="clayS" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#1E4E8C" flood-opacity="0.55" result="d"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset in="b" dx="3" dy="3" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.8"/>
      <feComposite in2="e1" operator="in" result="hi"/>
      <feOffset in="b" dx="-3" dy="-3" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/>
      <feFlood flood-color="#143A6B" flood-opacity="0.5"/>
      <feComposite in2="e2" operator="in" result="sh"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="hi"/><feMergeNode in="sh"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Arial Rounded MT Bold','Nunito','Segoe UI Black','Segoe UI',Helvetica,Arial,sans-serif; }
    .f1 { animation: fl 5s ease-in-out infinite; }
    .f2 { animation: fl 5s ease-in-out -1.7s infinite; }
    .f3 { animation: fl 5s ease-in-out -3.3s infinite; }
    @keyframes fl { 50% { transform: translateY(-6px); } }
    .tw { animation: tw 3s ease-in-out infinite; }
    .d1 { animation-delay: -0.8s; } .d2 { animation-delay: -1.6s; } .d3 { animation-delay: -2.3s; }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .f1, .f2, .f3, .tw { animation: none; } .tw { opacity: 0.8; } }
  </style>

  <!-- canvas + starfield -->
  <g clip-path="url(#cp)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle cx="930" cy="40" r="120" fill="#2F6DB5" opacity="0.22" filter="url(#soft)"/>
    <circle cx="90" cy="300" r="130" fill="#1E4E8C" opacity="0.26" filter="url(#soft)"/>
    <circle cx="800" cy="150" r="200" fill="none" stroke="#5B94D6" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="800" cy="150" r="270" fill="none" stroke="#5B94D6" stroke-opacity="0.06" stroke-width="2"/>
    <circle cx="150" cy="150" r="230" fill="none" stroke="#5B94D6" stroke-opacity="0.05" stroke-width="2"/>

    <g fill="#B9D3F3">
      <circle cx="120" cy="26" r="1.5" opacity="0.8"/><circle cx="210" cy="14" r="1.2" opacity="0.6"/>
      <circle cx="380" cy="30" r="1.6" opacity="0.8"/><circle cx="530" cy="18" r="1.2" opacity="0.6"/>
      <circle cx="585" cy="84" r="1.5" opacity="0.7"/><circle cx="598" cy="176" r="1.3" opacity="0.6"/>
      <circle cx="585" cy="262" r="1.6" opacity="0.8"/><circle cx="700" cy="284" r="1.4" opacity="0.7"/>
      <circle cx="880" cy="22" r="1.5" opacity="0.8"/><circle cx="975" cy="64" r="1.3" opacity="0.6"/>
      <circle cx="985" cy="156" r="1.6" opacity="0.8"/><circle cx="978" cy="206" r="1.2" opacity="0.6"/>
      <circle cx="890" cy="282" r="1.5" opacity="0.7"/><circle cx="420" cy="288" r="1.3" opacity="0.6"/>
      <circle cx="250" cy="286" r="1.5" opacity="0.8"/><circle cx="22" cy="150" r="1.4" opacity="0.6"/>
    </g>
    <g fill="#E6EEFA">
      <use href="#sp" class="tw" transform="translate(30 30) scale(0.75)"/>
      <use href="#sp" class="tw d1" fill="#7FB59F" transform="translate(300 24) scale(0.95)"/>
      <use href="#sp" class="tw d2" transform="translate(468 38) scale(0.6)"/>
      <use href="#sp" class="tw d3" fill="#EBB892" transform="translate(790 26) scale(1)"/>
      <use href="#sp" class="tw d1" transform="translate(952 34) scale(0.7)"/>
      <use href="#sp" class="tw d2" fill="#7FB59F" transform="translate(612 134) scale(0.9)"/>
      <use href="#sp" class="tw" transform="translate(988 258) scale(0.8)"/>
      <use href="#sp" class="tw d3" transform="translate(792 284) scale(0.9)"/>
      <use href="#sp" class="tw d1" transform="translate(500 284) scale(0.65)"/>
      <use href="#sp" class="tw d2" fill="#EBB892" transform="translate(24 282) scale(0.8)"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="29.5" fill="none" stroke="#5B94D6" stroke-opacity="0.2"/>

  <!-- identity -->
  <text x="52" y="116" font-size="100" font-weight="900" textLength="520" lengthAdjust="spacingAndGlyphs" fill="url(#gT)" filter="url(#clayT)">DEVYAJI</text>

  <rect x="52" y="140" width="520" height="46" rx="23" fill="url(#gP)" filter="url(#clay)"/>
  <text x="312" y="169" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">BSIT student at Quezon City University</text>

  <text x="52" y="222" font-size="18" fill="#8DB6E8"><tspan font-weight="800" fill="#E6EEFA">Chief Technology Officer</tspan> @ Seegla</text>
  <text x="52" y="247" font-size="18" fill="#8DB6E8"><tspan font-weight="800" fill="#E6EEFA">QA Intern</tspan> @ Bayani Technology Solutions Inc.</text>
  <text x="52" y="272" font-size="18" font-weight="800" fill="#E6EEFA">2x Hackathon Winner</text>

  <!-- floating clay pills -->
  <g class="f1">
    <rect x="650" y="50" width="270" height="62" rx="31" fill="url(#g1)" filter="url(#clay)"/>
    <circle cx="686" cy="81" r="15" fill="url(#gS)" filter="url(#clayS)"/>
    <text x="716" y="89" font-size="22" font-weight="800" fill="#0F2747">AI Engineering</text>
  </g>
  <g class="f2">
    <rect x="700" y="126" width="240" height="62" rx="31" fill="url(#g2)" filter="url(#clay)"/>
    <circle cx="736" cy="157" r="15" fill="url(#gS)" filter="url(#clayS)"/>
    <text x="766" y="165" font-size="22" font-weight="800" fill="#0F2747">DevOps</text>
  </g>
  <g class="f3">
    <rect x="650" y="202" width="270" height="62" rx="31" fill="url(#g3)" filter="url(#clay)"/>
    <circle cx="686" cy="233" r="15" fill="url(#gS)" filter="url(#clayS)"/>
    <text x="716" y="241" font-size="22" font-weight="800" fill="#FFFFFF">Automation</text>
  </g>

  <!-- clay spheres -->
  <circle cx="618" cy="48" r="16" fill="url(#gS)" filter="url(#clayS)"/>
  <circle cx="966" cy="108" r="12" fill="url(#gS)" filter="url(#clayS)"/>
  <circle cx="960" cy="236" r="18" fill="url(#gS)" filter="url(#clayS)"/>
</svg>
